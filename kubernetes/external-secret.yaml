apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: production-database-secret
  namespace: cride-delivery
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-vault
    kind: ClusterSecretStore
  target:
    name: application-runtime-secret
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: cride/production/rds
        property: password
